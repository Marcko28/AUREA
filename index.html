<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--border:#2a2a2a;
  --text:#f2f2f2;--muted:#8d8d8d;--accent:#e8ff3b;--orange:#ff6b35;--teal:#3bffd4;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;touch-action:manipulation;padding-bottom:calc(110px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
button{font-family:inherit;cursor:pointer}

/* Header */
.top{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px 14px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:52px;line-height:.9;letter-spacing:.02em;margin-top:6px;font-weight:400}
h1 span{color:var(--accent)}

/* Tabs */
.tabs{position:sticky;top:0;z-index:30;background:rgba(10,10,10,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.tabs-in{max-width:560px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{height:46px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:6px}
.tab small{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.04em;color:var(--muted);font-weight:600;text-transform:uppercase}
.tab.on{background:var(--accent);color:#0a0a0a;border-color:var(--accent)}
.tab.on small{color:#0a0a0a}

/* Regole */
.rules{margin-top:16px;background:linear-gradient(135deg,rgba(255,107,53,.14),rgba(232,255,59,.06));border:1px solid rgba(255,107,53,.4);border-radius:18px;padding:0 16px}
.rules summary{list-style:none;padding:15px 0;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rules summary::-webkit-details-marker{display:none}
.rules summary .t{flex:1}
.rules summary .t em{display:block;font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.plus{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:15px;line-height:1;opacity:.7;transition:transform .2s}
details[open] > summary .plus{transform:rotate(45deg)}
.rules .body{padding:0 0 16px;display:grid;gap:12px;font-size:14px}
.rules .body p b{color:var(--accent);font-weight:700;letter-spacing:.02em}
.rules .yellow-demo{display:inline-block;width:14px;height:14px;border-radius:4px;background:rgba(232,255,59,.18);border:1px solid var(--accent);vertical-align:-2px;margin-right:4px}
.rules .video-note{background:rgba(0,0,0,.35);border-radius:12px;padding:10px 12px;font-size:13.5px}

/* Sezioni */
.sec{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.sec-n{font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;color:#0a0a0a;background:var(--accent);border-radius:6px;padding:3px 7px 1px;line-height:1.1}
.sec-n.alt{background:var(--teal)}
.sec-n.mute{background:#3a3a3a;color:var(--text)}
.sec-t{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;letter-spacing:.04em;line-height:1}

/* Riscaldamento / defaticamento */
.warm{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.warm-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.warm-n{font-weight:700;font-size:15px}
.warm-p{font-size:13px;color:var(--accent);font-weight:600;text-align:right;flex:none;max-width:52%}
.warm-x{font-size:13px;color:var(--muted);margin-top:4px}

/* Card esercizio */
.ex{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mus{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:700}
.ex h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:30px;line-height:1;letter-spacing:.02em;margin-top:3px}
.vid{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#0a0a0a;font-weight:700;font-size:13.5px;padding:0 13px;height:40px;border-radius:12px;text-decoration:none}
.vid svg{width:14px;height:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--border);background:var(--card2);color:var(--text)}
.chip.m50{color:var(--orange);border-color:rgba(255,107,53,.5)}
.chip.ced{color:var(--teal);border-color:rgba(59,255,212,.45)}
.chip.fit,.chip.rep{color:var(--teal);border-color:rgba(59,255,212,.45)}
.chip.rest{color:var(--accent);border-color:rgba(232,255,59,.45)}
.chip.rest svg{width:14px;height:14px}
.chip.rest:active{background:rgba(232,255,59,.15)}

.hint{margin-top:12px;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:12px;background:rgba(232,255,59,.07);color:var(--accent);border:1px solid rgba(232,255,59,.22)}
.warn{margin-top:8px;font-size:13px;padding:9px 12px;border-radius:12px;background:rgba(255,107,53,.1);color:var(--orange);border:1px solid rgba(255,107,53,.35)}

/* Log pesi */
.log{margin-top:14px;display:grid;gap:8px;align-items:center}
.log.ced{grid-template-columns:30px 1fr 1fr}
.log.m50{grid-template-columns:1fr 1fr}
.log.fit{grid-template-columns:repeat(3,1fr)}
.lh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.lh.k{color:var(--accent)}
.sl{font-family:'Bebas Neue',Impact,sans-serif;font-size:19px;color:var(--muted);text-align:center}
.in{width:100%;height:48px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:19px;font-weight:700;text-align:center;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.in::placeholder{color:#4e4e4e;font-weight:600}
.in:focus{border-color:var(--text)}
.in.key{border-color:rgba(232,255,59,.6);background:rgba(232,255,59,.07)}
.in.key:focus{border-color:var(--accent)}

/* Contatore 50 colpi */
.cnt{margin-top:14px;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:10px}
.cnt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cnt-h span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cnt-h > div{display:flex;align-items:center;gap:4px;flex:none;white-space:nowrap}
.cnt-tot{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;color:var(--orange);letter-spacing:.03em;line-height:1}
.cnt-reset{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:4px 0 4px 10px}
.blks{display:flex;gap:5px}
.blk{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700}
.blk.first{flex:1.4}
.blk.done{background:var(--orange);border-color:var(--orange);color:#0a0a0a}
.cnt-x{font-size:11.5px;color:var(--muted);margin-top:7px;text-align:center}

/* Storico */
.hist{margin-top:12px;font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.hist b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.hist div span{display:inline-block;min-width:46px;color:var(--text);font-weight:600}

/* Dettagli */
.dt{margin-top:12px;border-top:1px solid var(--border)}
.dt summary{list-style:none;padding:13px 0 1px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.dt summary::-webkit-details-marker{display:none}
.dt summary .lbl{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.m50{background:var(--orange)}.dot.ced{background:var(--teal)}
.dt .plus{width:22px;height:22px;font-size:14px;color:var(--muted)}
.dt-b{padding:10px 0 4px;font-size:14px;color:#cfcfcf;display:grid;gap:10px}
.dt-b h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:3px}

/* Fine */
.finish{width:100%;height:58px;border-radius:16px;background:var(--accent);color:#0a0a0a;font-size:16.5px;font-weight:700;border:0;margin-top:26px}
.finish:active{opacity:.85}
.finish-x{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:center}
.foot button{background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:600;padding:9px 13px;border-radius:10px}

/* Cronologia */
.chrono{margin-top:34px}
.chrono .sec{margin-top:0}
.lg-row{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px;color:var(--text);text-align:left}
.lg-row:active{background:var(--card2)}
.lg-l{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:#0a0a0a;font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;display:grid;place-items:center;line-height:1;padding-top:3px}
.lg-l.B{background:var(--teal)}.lg-l.C{background:var(--orange)}
.lg-t{flex:1;min-width:0}
.lg-d{font-weight:700;font-size:15px}
.lg-s{font-size:12.5px;color:var(--muted);margin-top:1px}
.lg-c{flex:none;color:var(--muted);font-size:20px}
.lg-empty{background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px}
.lg-more{width:100%;height:44px;border-radius:12px;border:1px solid var(--border);background:none;color:var(--muted);font-weight:600;font-size:13.5px}

/* Dettaglio allenamento */
.sheet{position:fixed;z-index:70;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .28s ease;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.sh-top{position:sticky;top:0;z-index:2;background:rgba(10,10,10,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.sh-top-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.sh-top-in .lg-l{width:48px;height:48px;font-size:30px}
.sh-tt{flex:1;min-width:0}
.sh-tt h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:30px;line-height:1;letter-spacing:.02em}
.sh-tt div{font-size:13px;color:var(--muted);margin-top:2px}
.sh-x{flex:none;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:14px}
.sh-ex{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:10px}
.sh-ex h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:24px;line-height:1;letter-spacing:.02em;margin-top:3px}
.sh-ex .chip{margin-top:8px;height:26px;font-size:12px;padding:0 9px}
.sh-v{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.sh-v.two{grid-template-columns:1fr 1fr}
.sh-c{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center}
.sh-c.k{border-color:rgba(232,255,59,.6);background:rgba(232,255,59,.07)}
.sh-c small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sh-c b{font-size:17px;font-weight:700}
.sh-c b i{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.sh-none{margin-top:10px;font-size:12.5px;color:var(--muted)}
.sh-del{width:100%;height:48px;margin-top:26px;border-radius:14px;border:1px solid rgba(255,107,53,.45);background:rgba(255,107,53,.08);color:var(--orange);font-weight:700;font-size:14.5px}

.soon{margin-top:24px;background:var(--card);border:1px dashed var(--border);border-radius:20px;padding:34px 20px;text-align:center}
.soon h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.03em}
.soon p{color:var(--muted);margin-top:6px;font-size:14px}

/* Timer recupero */

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(x)?null:x};
const hasVals=o=>!!o&&Object.values(o).some(v=>v!==''&&v!=null);
const lastFor=(d,id)=>{const h=S[d].hist.find(e=>hasVals(e.v[id]));return h?h.v[id]:null};
const histFor=(d,id,n)=>S[d].hist.filter(e=>hasVals(e.v[id])).slice(0,n);
const KR=t=>t==='ced'||t==='rep';
const NS=ex=>ex.sets||3;
const rng=n=>Array.from({length:n},(_,i)=>i+1);
const fmtDate=iso=>{const p=iso.split('-');return p[2]+'/'+p[1]};
function findEx(id){for(const d in DAYS){if(!DAYS[d])continue;for(const s of DAYS[d].sections)for(const it of s.items)if(it.id===id)return it}return null}

function fmtEntry(ex,v){
  const type=ex.type;
  if(KR(type)) return rng(NS(ex)).map(i=>(v['s'+i+'kg']||v['s'+i+'r'])?`${v['s'+i+'kg']||'–'}×${v['s'+i+'r']||'–'}`:null).filter(Boolean).join('  ·  ');
  if(type==='m50') return `${v.kg0||'–'} kg`+(v.kg1?` → ${v.kg1} kg`:'');
  return rng(NS(ex)).map(i=>v['s'+i+'kg']).filter(Boolean).join('  ·  ')+' kg';
}
function hintFor(ex,last){
  if(ex.type==='ced'){
    if(!last) return 'Prima seduta: trova il carico che ti porta a cedimento tra 6 e 12 ripetizioni.';
    const r=num(last.s1r), kg=last.s1kg||'?';
    if(r!==null&&r>=12) return `Ultima volta ${kg} kg × ${r} alla 1ª serie → oggi alza il carico e riparti da 6/8.`;
    if(r!==null) return `Ultima volta ${kg} kg × ${r} alla 1ª serie → oggi stesso carico, prova a fare ${r+1} o più ripetizioni.`;
    return null;
  }
  if(ex.type==='m50'){
    if(!last||!last.kg0) return 'Prima seduta: parti con il carico più alto con cui riesci a fare 12 ripetizioni.';
    return `Ultima partenza ${last.kg0} kg → oggi prova a partire più alto.`;
  }
  return null;
}

}

  if(KR(ex.type)){
    let h=`<div class="log ced"><span></span><span class="lh">Kg</span><span class="lh">Rip${ex.side?' '+ex.side:''}</span>`;
    for(const i of rng(NS(ex))) h+=`<span class="sl">S${i}</span>${inp(ex.id,'s'+i+'kg',L['s'+i+'kg'],i===1,'decimal')}${inp(ex.id,'s'+i+'r',L['s'+i+'r'],i===1,'numeric')}`;
    return h+`</div><div class="warn" hidden></div>`;
  }
  if(ex.type==='m50'){
    return `<div class="log m50"><span class="lh k">Kg partenza</span><span class="lh">Kg finale (se cali)</span>${inp(ex.id,'kg0',L.kg0,true,'decimal')}${inp(ex.id,'kg1',L.kg1,false,'decimal')}</div>`;
  }
  return `<div class="log fit"><span class="lh k">S1 · kg disco</span><span class="lh">S2 · kg</span><span class="lh">S3 · kg</span>${inp(ex.id,'s1kg',L.s1kg,true,'decimal')}${inp(ex.id,'s2kg',L.s2kg,false,'decimal')}${inp(ex.id,'s3kg',L.s3kg,false,'decimal')}</div>`;
}
function counterHtml(){
  return `<div class="cnt"><div class="cnt-h"><span>Contatore blocchi</span><div><b class="cnt-tot">0 / 50</b><button class="cnt-reset">Azzera</button></div></div>
  <div class="blks">${BLOCKS.map((b,i)=>`<button class="blk${i===0?' first':''}" data-v="${b}">${b}</button>`).join('')}</div>
  <div class="cnt-x">5″ di pausa tra un blocco e l'altro</div></div>`;
}
function methodHtml(type){
  const m=METHOD[type];
  return `<details class="dt"><summary><span class="lbl"><i class="dot ${type}"></i>${m.title}</span><span class="plus">+</span></summary>
  <div class="dt-b"><div><h4>Cosa significa</h4><p>${m.cosa}</p></div><div><h4>Come si progredisce</h4><p>${m.prog}</p></div></div></details>`;
}
function exCard(ex){
  const last=lastFor(day,ex.id), hint=hintFor(ex,last), hist=histFor(day,ex.id,3);
  return `<article class="ex" data-id="${ex.id}">
    <div class="ex-top"><div><div class="mus">${ex.muscle}</div><h3>${ex.name}</h3></div>
      ${ex.video?`<a class="vid" href="${ex.video}" target="_blank" rel="noopener">${PLAY}Video</a>`:''}</div>
    <div class="chips"><span class="chip ${ex.type}">${ex.proto}</span>${ex.rest?`<button class="chip rest" data-rest="${ex.rest}" data-name="${esc(ex.name)}">${CLOCK}Recupero ${ex.rest/60} min${ex.restNote?' '+ex.restNote:''}</button>`:''}</div>
    ${hint?`<div class="hint">${hint}</div>`:''}
    ${logHtml(ex,last)}
    ${ex.type==='m50'?counterHtml():''}
    ${hist.length?`<div class="hist"><b>Ultime sedute</b>${hist.map(h=>`<div><span>${fmtDate(h.d)}</span>${fmtEntry(ex,h.v[ex.id])}</div>`).join('')}</div>`:''}
    <details class="dt"><summary><span class="lbl"><i class="dot"></i>Tecnica</span><span class="plus">+</span></summary><div class="dt-b"><p>${ex.tech}</p></div></details>
    ${METHOD[ex.type]?methodHtml(ex.type):''}
  </article>`;
}
function rulesHtml(){
  return `<details class="rules"><summary><span class="t">🔥 La cosa più importante: progredire mantenendo la tecnica<em>Un kg in più con l'esecuzione che peggiora non è un progresso.</em></span><span class="plus">+</span></summary>
  <div class="body">
    <p><b>6/12 CEDIMENTO</b> · Usi un carico con cui arrivi a cedimento tra 6 e 12 ripetizioni. Quando alla prima serie arrivi a 12, la settimana dopo alzi il carico e riparti più in basso. Ogni settimana migliori una cosa: o il carico o le ripetizioni.</p>
    <p><b>SE CENTRI DAVVERO IL CEDIMENTO</b> · È normale che nella seconda e nella terza serie fai meno ripetizioni della prima (per esempio 10, 9, 8). Vuol dire che hai lavorato bene. Se ne perdi più di 2 tra una serie e l'altra recupera un po' di più.</p>
    <p><b>50 COLPI</b> · 12 ripetizioni con il carico più alto che gestisci, poi 5 secondi di pausa e 5 ripetizioni, avanti così fino a 42, chiudi con 2 mini serie da 4 sempre con 5 secondi di pausa. Ogni seduta provi a partire con più carico.</p>
    <p><span class="yellow-demo"></span><b>CAMPI GIALLI</b> · Kg e ripetizioni della prima serie (nei 50 colpi il carico di partenza): sono quelli che contano per la progressione.</p>
    <p class="video-note">🎥 Fatti dei video e mandali al trainer, così guarda le esecuzioni e ti corregge.</p>
  </div></details>`;
}
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.day===day));
  $('#title').innerHTML=`Giorno <span>${day}</span>`;
  const D=DAYS[day];
  let h=rulesHtml();
  if(!D){
    h+=`<div class="soon"><h2>Giorno ${day} in arrivo</h2><p>Manda la scheda del Giorno ${day} e la aggiungo qui, con lo stesso formato.</p></div>`;
  }else{
    D.sections.forEach(sec=>{
      h+=`<div class="sec"><span class="sec-n${sec.alt?' alt':''}${sec.mute?' mute':''}">${sec.n}</span><span class="sec-t">${sec.name}</span></div>`;
      sec.items.forEach(it=>{
        if(sec.kind==='warm') h+=`<div class="warm"><div class="warm-h"><span class="warm-n">${it.name}</span>${it.proto?`<span class="warm-p">${it.proto}</span>`:''}</div>${it.note?`<div class="warm-x">${it.note}</div>`:''}</div>`;
        else h+=exCard(it);
      });
    });
    const n=S[day].hist.length;
    h+=`<button class="finish" id="finish">✓ Concludi allenamento</button>
        <div class="finish-x">Salva i pesi di oggi nello storico e svuota i campi.${n?` Sedute salvate: ${n}.`:''}</div>`;
  }
  h+=chronoHtml();
  h+=`<div class="foot"><button id="exp">Esporta backup</button><button id="imp">Importa backup</button></div>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('.ex').forEach(c=>checkWarn(c.dataset.id));
}
/* ---------- Cronologia ---------- */
let chronoAll=false;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function longDate(iso){
  const p=iso.split('-').map(Number), dt=new Date(p[0],p[1]-1,p[2]);
  try{return cap(dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}catch(e){return iso}
}
function allSessions(){
  const out=[];
  ['A','B','C'].forEach(d=>S[d].hist.forEach((e,i)=>out.push({day:d,i,e,ts:e.t||Date.parse(e.d+'T12:00:00')||0})));
  return out.sort((a,b)=>b.ts-a.ts||a.i-b.i);
}
function countEx(e){return Object.values(e.v||{}).filter(hasVals).length}
function chronoHtml(){
  const list=allSessions();
  let h=`<section class="chrono"><div class="sec"><span class="sec-n mute">≡</span><span class="sec-t">Cronologia allenamenti</span></div>`;
  if(!list.length) return h+`<div class="lg-empty">Ancora nessun allenamento salvato.<br>Quando tocchi "Concludi allenamento" lo trovi qui.</div></section>`;
  const shown=chronoAll?list:list.slice(0,10);
  shown.forEach(s=>{
    const n=countEx(s.e);
    h+=`<button class="lg-row" data-day="${s.day}" data-i="${s.i}"><span class="lg-l ${s.day}">${s.day}</span><span class="lg-t"><div class="lg-d">${longDate(s.e.d)}</div><div class="lg-s">Giorno ${s.day} · ${n} eserciz${n===1?'io':'i'} registrat${n===1?'o':'i'}</div></span><span class="lg-c">›</span></button>`;
  });
  if(list.length>10) h+=`<button class="lg-more" id="lgMore">${chronoAll?'Mostra meno':`Mostra tutti (${list.length})`}</button>`;
  return h+`</section>`;
}
function cell(lbl,val,unit,key){return `<div class="sh-c${key?' k':''}"><small>${lbl}</small><b>${val?esc(val)+(unit?` <i>${unit}</i>`:''):'–'}</b></div>`}
function sessionValsHtml(ex,v){
  if(KR(ex.type)) return `<div class="sh-v${NS(ex)===2?' two':''}">${rng(NS(ex)).map(i=>{const kg=v['s'+i+'kg'],r=v['s'+i+'r'];return `<div class="sh-c${i===1?' k':''}"><small>Serie ${i}</small><b>${kg?esc(kg)+' <i>kg</i>':'–'}</b><div style="font-size:13px;color:var(--muted);font-weight:600">${r?'× '+esc(r)+' rip':''}</div></div>`}).join('')}</div>`;
  if(ex.type==='m50') return `<div class="sh-v two">${cell('Partenza',v.kg0,'kg',true)}${cell('Finale',v.kg1,'kg',false)}</div>`;
  return `<div class="sh-v">${rng(NS(ex)).map(i=>cell('Serie '+i,v['s'+i+'kg'],'kg',i===1)).join('')}</div>`;
}
let openSess=null;
function openSession(d,i){
  const e=S[d].hist[i], D=DAYS[d]; if(!e)return;
  openSess={d,i};
  let h=`<div class="sh-top"><div class="sh-top-in"><span class="lg-l ${d}">${d}</span><div class="sh-tt"><h2>Giorno ${d}</h2><div>${longDate(e.d)}</div></div><button class="sh-x" id="shClose">Chiudi</button></div></div><div class="wrap">`;
  if(D){
    D.sections.forEach(sec=>{
      const items=sec.items.filter(it=>it.id);
      if(!items.length)return;
      h+=`<div class="sec" style="margin:22px 0 2px"><span class="sec-n${sec.alt?' alt':''}">${sec.n}</span><span class="sec-t">${sec.name}</span></div>`;
      items.forEach(ex=>{
        const v=e.v[ex.id];
        h+=`<div class="sh-ex"><div class="mus">${ex.muscle}</div><h3>${ex.name}</h3><span class="chip ${ex.type}">${ex.proto}</span>${hasVals(v)?sessionValsHtml(ex,v):'<div class="sh-none">Non registrato</div>'}</div>`;
      });
    });
  }
  h+=`<button class="sh-del" id="shDel">Elimina questo allenamento</button></div>`;
  const s=$('#sheet'); s.innerHTML=h; s.scrollTop=0;
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>s.classList.add('show'));
}
function closeSession(){ $('#sheet').classList.remove('show'); document.body.style.overflow=''; openSess=null; }
$('#sheet').addEventListener('click',e=>{
  if(e.target.closest('#shClose')){closeSession();return}
  if(e.target.closest('#shDel')&&openSess){
    if(!confirm('Eliminare questo allenamento dalla cronologia? Non si può annullare.'))return;
    S[openSess.d].hist.splice(openSess.i,1); save(); closeSession(); render(); toast('Allenamento eliminato');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openSess)closeSession()});

function renderTabs(){
  $('#tabs').innerHTML=['A','B','C'].map(d=>`<button class="tab" data-day="${d}">${d}${DAYS[d]?'':'<small>presto</small>'}</button>`).join('');
}

/* ---------- Avviso calo ripetizioni ---------- */
function checkWarn(id){
  const ex=findEx(id); if(!ex||ex.type!=='ced')return;
  const card=document.querySelector(`.ex[data-id="${id}"]`); if(!card)return;
  const c=S[day].cur[id]||{}, r=[1,2,3].map(i=>num(c['s'+i+'r']));
  const drop=(r[0]!==null&&r[1]!==null&&r[0]-r[1]>2)||(r[1]!==null&&r[2]!==null&&r[1]-r[2]>2);
  const w=card.querySelector('.warn');
  w.hidden=!drop;
  if(drop) w.textContent='Hai perso più di 2 ripetizioni tra una serie e l\'altra: recupera un po\' di più.';
}

/* ---------- Timer ---------- */
let tEnd=0,tInt=null,actx=null;
function beep(){
  try{ if(!actx)return; const now=actx.currentTime;
    [0,.28,.56].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(.0001,now+o);g.gain.exponentialRampToValueAtTime(.35,now+o+.02);g.gain.exponentialRampToValueAtTime(.0001,now+o+.2);os.start(now+o);os.stop(now+o+.22);});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $('#timerVal').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(left===0){clearInterval(tInt);tInt=null;$('#timer').classList.add('done');$('#timerLbl').textContent='Recupero finito · vai!';beep();}
}
function startTimer(sec,name){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
  tEnd=Date.now()+sec*1000;
  $('#timerLbl').textContent='Recupero · '+name;
  const t=$('#timer');t.classList.remove('done');t.classList.add('show');
  clearInterval(tInt);tick();tInt=setInterval(tick,250);
}
function stopTimer(){clearInterval(tInt);tInt=null;$('#timer').classList.remove('show','done');}
$('#timerStop').onclick=stopTimer;
$('#timerAdd').onclick=()=>{ if(!tInt){tEnd=Date.now();$('#timer').classList.remove('done');tInt=setInterval(tick,250);} tEnd+=30000; $('#timerLbl').textContent=$('#timerLbl').textContent.replace('Recupero finito · vai!','Recupero'); tick(); };

/* ---------- Toast ---------- */
let toT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- Eventi ---------- */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  day=b.dataset.day; try{localStorage.setItem(STORE+'_tab',day)}catch(err){}
  render(); window.scrollTo({top:0});
});
const app=$('#app');
app.addEventListener('input',e=>{
  const t=e.target; if(!t.classList.contains('in'))return;
  const id=t.dataset.ex,f=t.dataset.f;
  (S[day].cur[id]=S[day].cur[id]||{})[f]=t.value.trim();
  save(); checkWarn(id);
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.classList.contains('in'))return;
  e.preventDefault();
  const all=[...app.querySelectorAll('.in')], i=all.indexOf(e.target);
  if(all[i+1]&&all[i+1].closest('.ex')===e.target.closest('.ex'))all[i+1].focus(); else e.target.blur();
});
app.addEventListener('click',e=>{
  const r=e.target.closest('.rest');
  if(r){startTimer(+r.dataset.rest,r.dataset.name);return}
  const b=e.target.closest('.blk');
  if(b){b.classList.toggle('done');updCnt(b.closest('.cnt'));return}
  const z=e.target.closest('.cnt-reset');
  if(z){const c=z.closest('.cnt');c.querySelectorAll('.blk').forEach(x=>x.classList.remove('done'));updCnt(c);return}
  const lr=e.target.closest('.lg-row');
  if(lr){openSession(lr.dataset.day,+lr.dataset.i);return}
  if(e.target.closest('#lgMore')){chronoAll=!chronoAll;render();return}
  if(e.target.closest('#finish')){finish();return}
  if(e.target.closest('#exp')){exportB();return}
  if(e.target.closest('#imp')){importB();return}
});
function updCnt(c){
  const tot=[...c.querySelectorAll('.blk.done')].reduce((a,x)=>a+(+x.dataset.v),0);
  c.querySelector('.cnt-tot').textContent=tot+' / 50';
}
function finish(){
  const cur=S[day].cur;
  if(!Object.values(cur).some(hasVals)){toast('Nessun peso inserito oggi');return}
  if(!confirm("Salvare l'allenamento di oggi nello storico?\nI campi verranno svuotati per la prossima seduta."))return;
  const d=new Date(), iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  S[day].hist.unshift({d:iso,t:Date.now(),v:JSON.parse(JSON.stringify(cur))});
  S[day].hist=S[day].hist.slice(0,150);
  S[day].cur={};
  save(); render(); window.scrollTo({top:0,behavior:'smooth'}); toast('Allenamento salvato');
}
function exportB(){
  const txt=JSON.stringify(S);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Backup copiato: incollalo in una Nota')).catch(()=>prompt('Copia questo testo e salvalo in una Nota:',txt));
  }else prompt('Copia questo testo e salvalo in una Nota:',txt);
}
function importB(){
  const t=prompt('Incolla qui il testo del backup:'); if(!t)return;
  try{const o=JSON.parse(t); if(!o||!o.A)throw 0; S=o; ensure(); save(); render(); toast('Backup ripristinato');}
  catch(err){toast('Backup non valido');}
}

renderTabs(); render();
</script>
</body>
</html>
